plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'nemo.seon'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation fileTree(dir: 'jars', include: ['**/*.jar']) // The "**/*.jar" indicates that all .jar files, including those inside lib/, batik/, gvml/, etc., will be automatically added as dependencies.
    testImplementation 'org.mockito:mockito-core:5.5.0'

    // Spring boot web for api rest
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Upload files
    implementation 'commons-fileupload:commons-fileupload:1.5'
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.6'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // .env file support (replaces manual EnvLoader)
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // OWL API for generating the SEON .owl file
    implementation 'net.sourceforge.owlapi:owlapi-apibinding:5.5.0'

}

bootRun {
    jvmArgs = ['-Xss16m', '-Djava.awt.headless=true']
}

test {
    useJUnitPlatform()
}

// ============================================================
// Frontend (React + Vite) build integration
// ============================================================
def frontendDir = file("$projectDir/frontend")
def frontendDist = file("$frontendDir/dist")

tasks.register('npmInstall', Exec) {
    inputs.file(file("$frontendDir/package.json"))
    inputs.file(file("$frontendDir/package-lock.json"))
    outputs.dir(file("$frontendDir/node_modules"))
    workingDir = frontendDir
    commandLine 'npm', 'ci'
}

tasks.register('frontendBuild', Exec) {
    dependsOn 'npmInstall'
    inputs.dir(file("$frontendDir/src"))
    inputs.file(file("$frontendDir/vite.config.ts"))
    inputs.file(file("$frontendDir/tsconfig.json"))
    inputs.file(file("$frontendDir/index.html"))
    inputs.file(file("$frontendDir/package.json"))
    outputs.dir(frontendDist)
    workingDir = frontendDir
    commandLine 'npm', 'run', 'build'
}

processResources {
    dependsOn 'frontendBuild'
    from(frontendDist) {
        into 'static'
    }
}

// Configuração para lidar com dependências duplicadas
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

bootJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}