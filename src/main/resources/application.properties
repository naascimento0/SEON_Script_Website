spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# SEON Security Configuration
seon.admin.username=${SEON_ADMIN_USERNAME:admin}
seon.admin.password=${SEON_ADMIN_PASSWORD:admin}

# SEON Paths Configuration
seon.astah.filepath=${SEON_ASTAH_FILEPATH:astah_seon.asta}
seon.astah.script=${SEON_ASTAH_SCRIPT:jars/astah-command.sh}
seon.images.output=${SEON_IMAGES_OUTPUT:src/main/resources/static/images}
# Archive of every uploaded .asta plus the versions.json index describing them.
seon.astah.versions.dir=${SEON_ASTA_VERSIONS_DIR:asta-versions}
# Writable copy of the publication list; seeded from classpath:/publications.json on first run.
seon.publications.filepath=${SEON_PUBLICATIONS_FILEPATH:publications.json}

# Serve the writable filesystem copy first so diagrams regenerated on .asta
# upload win over the stale images bundled at build time (classpath / inside the jar).
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/